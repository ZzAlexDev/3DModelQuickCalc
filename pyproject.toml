[project]
name = "3dmodelquickcalc"
version = "0.1.0"
description = "Web calculator for 3D parts parameters"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi (>=0.128.0,<0.129.0)", "uvicorn[standard] (>=0.40.0,<0.41.0)", "jinja2 (>=3.1.6,<4.0.0)", "python-multipart (>=0.0.21,<0.0.22)", "trimesh (>=4.11.1,<5.0.0)", "pydantic (>=2.12.5,<3.0.0)", "pyyaml (>=6.0.3,<7.0.0)", "numpy (>=2.4.1,<3.0.0)"]  # Пустой список, зависимости будем добавлять через poetry add

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.14.13"

[tool.poetry]
packages = [{include = "3dmqc", from = "src"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"