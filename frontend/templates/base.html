<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DModelQuickCalc</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold">3D</span>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">3DModelQuickCalc</h1>
                </div>
                <div class="flex space-x-2">
                    <button class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        👤 User
                    </button>
                    <button class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition">
                        ⚙️ Settings
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-white border-t mt-12">
        <div class="container mx-auto px-4 py-6">
            <div class="text-center text-gray-600">
                © 2026 3DModelQuickCalc | v0.1.0
                <div class="mt-2 space-x-4">
                    <a href="/docs" target="_blank" class="text-blue-600 hover:underline">API Docs</a>
                    <a href="/health" class="text-green-600 hover:underline">Health</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- HTMX Script -->
    <script>
        // Auto-refresh статуса каждые 30 секунд
        setInterval(() => {
            const statusElement = document.getElementById('status-indicator');
            if (statusElement) {
                htmx.trigger(statusElement, 'load');
            }
        }, 30000);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
